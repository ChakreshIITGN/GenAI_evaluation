# pyproject.toml — RB GenAI evaluation
# Pinned project dependencies, managed with uv.
# Author: Dr. Chakresh Kr. Singh
# Prepared for Roland Berger (RB GenAI evaluation).

[project]
name = "genai-evaluation"
version = "0.1.0"
description = "Evaluation of LLM-based human simulations against real consumer answers (Roland Berger)"
readme = "README.md"
authors = [{ name = "Dr. Chakresh Kr. Singh" }]
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "seaborn>=0.13.2",
    "tiktoken>=0.14.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "openpyxl>=3.1", # pandas engine for reading the .xlsx data file
    "python-dotenv>=1.0", # loads the Ollama cloud API key from .env
    "lexicalrichness>=0.5", # MTLD lexical diversity (Stylometric)
    "nltk>=3.9",            # VADER sentiment (Stylometric)
    # eval branch (plan §3): all named in the master plan
    "spacy>=3.8",                 # sentence segmentation (Layer 2a)
    "sentence-transformers>=3.3", # embeddings (1a) + NLI cross-encoder (2b)
    "bertopic>=0.16",             # topic map (2c)
    "krippendorff>=0.8",          # judge-panel reliability (Layer 3)
    # agentic_workflow branch: LangChain LCEL agents (plan §1)
    "langchain>=1.3.15",
    "langchain-core>=1.5.6",
    "langchain-ollama>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
