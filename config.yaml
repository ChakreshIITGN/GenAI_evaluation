# config.yaml — RB GenAI evaluation
# Single place for models, seeds, paths and split sizes. No magic numbers in code.
# Author: Dr. Chakresh Kr. Singh
# Prepared for Roland Berger (RB GenAI evaluation).

llm:
  # Ollama cloud, called directly with an API key (OLLAMA_API_KEY in .env).
  # To use a local signed-in Ollama daemon instead, set host to
  # http://localhost:11434 and model to gpt-oss:120b-cloud.
  host: "https://ollama.com"
  model: "gpt-oss:120b"
  temperature: 0        # deterministic judgements
  seed: 42              # fixed seed for reproducibility
  cache_dir: "cache/eda"  # disk cache; committed so results reproduce without keys

paths:
  data: "data/RB_GenAI_Datatest.xlsx"   # confidential, gitignored
  prompts: "user_prompts"               # all user-editable prompts live here
  results: "output"                     # all run outputs (CSV/JSON) land here
  plots: "output/plots"                 # all figures land here

scrape:
  # RB-AI-publ branch: scrape the RB AI publications listing (scrape_rb_ai.py).
  # Output goes under data/ (gitignored): the article text is RB copyright.
  listing_url: "https://www.rolandberger.com/en/Insights/Global-Topics/Artificial-Intelligence/Publications/"
  article_prefix: "https://www.rolandberger.com/en/Insights/Publications/"
  output: "data/rb_ai_publications.json"
  user_agent: "Mozilla/5.0 (RB GenAI evaluation research scraper)"
  timeout_s: 30         # per request
  delay_s: 1.0          # pause between article requests, to be polite
  boilerplate_min_articles: 3  # a line in this many articles is a site template
  # Sentences that ask the reader to register, subscribe or download are
  # site calls to action, not article content. Matched case-insensitively,
  # one sentence at a time (some sit at the end of real paragraphs).
  call_to_action_patterns:
    - "^(register|sign up|subscribe|stay current|stay up to date|curious about)\\b"
    - "download (a copy|the full|our)"
    - "(contact|get in touch with) one of our experts"
    - "access the full (study|publication|report)"
    - "regular news and updates"
    - "we will email you"
    - "hearing from you"

embed:
  # RB-AI-publ branch: chunk + embed the scraped articles (embed_rb_ai.py).
  # Ollama Cloud serves no embedding models, so this runs locally with the
  # same sentence-transformers model the eval uses (already cached).
  model: "sentence-transformers/all-mpnet-base-v2"
  chunk_tokens: 300     # max text tokens per chunk (model tokenizer)
  overlap_tokens: 50    # trailing sentences carried into the next chunk
  batch_size: 32
  output: "data/rb_ai_chunks.jsonl"          # one chunk per line, with vector
  manifest: "data/rb_ai_chunks_manifest.json" # model, dim, settings, counts

analysis:
  # RB-AI-publ branch: clusters, network, stance and voices (analyze_rb_ai.py).
  # LLM = llm.model via src/llm.py. Its cache stores prompts (article text),
  # so it lives under data/ (gitignored), not the committed cache/.
  cache_dir: "data/cache_rb_ai"
  output: "data/rb_ai_analysis.json"
  # Silhouette is low and flat for every k (0.16-0.21); k=4 only splits the
  # 2018 magazine era from 2025-26 studies. 6-8 gives readable topic groups.
  k_min: 6
  k_max: 8
  seed: 42
  neighbours: 3         # network: link each article to its 3 most similar
  min_similarity: 0.65  # ... only if cosine similarity is at least this
  workers: 4            # parallel LLM calls
  # Second opinions on stance from other model families (agreement check).
  # deepseek-v4-flash was retired on 2026-09-25; v4.1 replaces it here.
  check_models: ["deepseek-v4.1-flash", "glm-5.2"]
  audit_sheet: "data/rb_ai_stance_audit.csv"  # blank columns for a human check

agents:
  # Agentic re-implementation (agentic_workflow branch): one JudgeAgent per
  # judge model in eda.judges. Same host/temperature/seed as llm above; a
  # SEPARATE cache so agentic runs never collide with src/llm.py's cache.
  cache_dir: "cache/agentic"          # disk cache keyed on (model, prompt hash)
  log_dir: "output/agent_logs"        # one JSONL call log per agent (monitoring)
  summary_file: "output/agent_summary.json"  # aggregated per-agent stats

eda:
  # Judge inputs are lowercased so orthography (caps/typos) cannot drive
  # verdicts — we cannot tell transcription artefacts from real style.
  # Deterministic style features still run on the raw text.
  lowercase_judge_inputs: true

  # Judge panel: three model families. EVERY judge answers EVERY question
  # (Q0 on all answers; Q1/Q2 on the same held-out set) so their verdicts
  # are directly comparable and we can measure inter-judge agreement.
  judges: ["gpt-oss:120b", "deepseek-v4-flash", "glm-5.2"]

  # One fixed, explainable within-person split, identical for every person
  # and every judge: these question_ids are held out and judged (Q1, Q2);
  # the person's other questions are the Q1 context. Q0 uses no split.
  held_out_questions: [7, 8, 9, 10]

eval:
  # Layer 3 — judge panel: different model families (generator unknown ->
  # diversify against self-preference). Same panel as the EDA judges.
  judges: ["gpt-oss:120b", "deepseek-v4-flash", "glm-5.2"]
  # Layer 1a — semantic similarity baseline (topic-dominated, not a KPI).
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  # Layer 2a — sentence segmentation model (spaCy).
  spacy_model: "en_core_web_sm"
  # Layer 2b — NLI entailment checker for coverage/fidelity.
  nli_model: "cross-encoder/nli-deberta-v3-base"
  # Layer 2c — BERTopic, seeded. Two small-n corrections (logged in
  # docs/DECISIONS.md): English stopwords in the topic-word vectorizer
  # (else topic names are "and, the, to"), and a smaller UMAP neighborhood
  # (defaults over-smooth ~200 short sentences into one mega-cluster).
  bertopic:
    min_topic_size: 5
    n_neighbors: 10
    seed: 42
    # Honest-try guard: the fit is declared DEGENERATE (and KPI 2 reported
    # as not computable) when it finds fewer topics than min_topics or one
    # topic swallows more than max_topic_share of the assigned sentences.
    min_topics: 3
    max_topic_share: 0.6
    # A topic is a blind spot / phantom when one side holds at least this
    # fraction of its sentences; otherwise it is covered. Provisional at n=30.
    dominance: 0.8
  # RAG thresholds for the category matrix — PROVISIONAL at n=30.
  rag_thresholds:
    green: 0.70   # mean coverage/fidelity at or above -> green
    amber: 0.40   # between amber and green -> amber; below -> red
